name: Validate generated packages
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 tools/generate.py --check
      - run: python3 -m unittest discover -s tools/tests -v
      - name: Check helper syntax
        run: |
          for package in claude codex antigravity agy; do
            node --check "$package/scripts/chrome_inspector.js"
            node --check "$package/scripts/validate_glyvio_rules.js"
          done
